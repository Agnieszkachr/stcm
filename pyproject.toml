[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stcm"
version = "0.1.0"
description = "Synoptic Transform Calibration Model — A supervised source-reconstruction approach to the Synoptic Problem"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "STCM Research Team"},
]
keywords = ["synoptic-problem", "Q-source", "NLP", "ancient-greek", "computational-philology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "transformers>=4.30",
    "torch>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
stcm-pipeline = "run_pipeline:main"

[tool.setuptools.packages.find]
include = ["stcm*"]
